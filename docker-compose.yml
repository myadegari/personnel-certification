services:
  mongodb:
    image: mongo:latest
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: certification
    volumes:
      - mongodb_data:/data/db
    command: --auth
    restart: unless-stopped
    # networks:
    #   - internal_network
  alarik:
    image: ghcr.io/achtungsoftware/alarik:latest
    # NOTE: STORAGE_REGION (app) must exactly match ALARIK_REGION below,
    # otherwise S3 requests are rejected with a region-mismatch error.
    environment:
      API_BASE_URL: ${ALARIK_API_BASE_URL:-http://alarik:8080}
      CONSOLE_BASE_URL: ${ALARIK_CONSOLE_BASE_URL:-http://localhost:3001}
      ALARIK_REGION: ${ALARIK_REGION:-us-east-1}
      ADMIN_USERNAME: ${ALARIK_ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ALARIK_ADMIN_PASSWORD}
      JWT: ${ALARIK_JWT}
      DEFAULT_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      DEFAULT_SECRET_KEY: ${STORAGE_SECRET_KEY}
      DEFAULT_BUCKETS: profile,signature,stamp,certificate
      ALLOW_ACCOUNT_CREATION: "false"
    volumes:
      - alarik_storage:/app/Storage
    restart: unless-stopped
    # networks:
    #   - internal_network
  # Optional web console for Alarik. Uncomment to manage buckets/keys via UI.
  alarik-console:
    image: ghcr.io/achtungsoftware/alarik-console:latest
    ports:
      - "3001:3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${ALARIK_PUBLIC_API_URL:-http://localhost:8080}
      NUXT_PUBLIC_CONSOLE_BASE_URL: http://localhost:3001
      NUXT_PUBLIC_ALLOW_ACCOUNT_CREATION: "false"
    depends_on:
      - alarik
    # networks:
    #   - internal_network
