services:
  mongodb:
    image: mongo:latest
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: certification
    volumes:
      - mongodb_data:/data/db
    command: --auth
    restart: unless-stopped
    networks:
      - internal_network
  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - internal_network
  nextjs:
    build: .
    container_name: nextjs
    depends_on:
      - mongodb
      - minio
    networks:
      - internal_network
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    depends_on:
      - nextjs
      - fastapi
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal_network
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER-certuser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST-tenant1}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:9105:5672"
      - "127.0.0.1:9106:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - internal_network
  redis:
    image: redis:7.2-alpine
    container_name: redis_cache
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:9107:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--raw", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - internal_network
  fastapi:
    build:
      context: ../certificate-service
      dockerfile: Dockerfile
    container_name: fastapi
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: ${RABBITMQ_VHOST-tenant1}
      RABBITMQ_USER: ${RABBITMQ_USER-certuser}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_JOB_QUEUE: certificate_jobs
      RABBITMQ_NOTIFICATION_QUEUE: certificate_notifications
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MONGODB_URI: mongodb://${MONGO_USER-admin}:${MONGO_PASSWORD}@mongodb:27017/certification?authSource=admin
      MONGODB_DB_NAME: certification
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_USER-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_CERT_BUCKET: certificates
      MINIO_REPORT_BUCKET: reports
      IMAGE_ACCESS_KEY: ${IMAGE_ACCESS_KEY}
      IMAGE_SERVICE_URL: "http://nextjs:3000/api/images"
      API_KEY: ${IMAGE_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - internal_network
  worker:
    build:
      context: ../certificate-service
      dockerfile: Dockerfile
    container_name: worker
    command: python worker.py
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f worker.py || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      minio:
        condition: service_started
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: ${RABBITMQ_VHOST-tenant1}
      RABBITMQ_USER: ${RABBITMQ_USER-certuser}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_JOB_QUEUE: certificate_jobs
      RABBITMQ_NOTIFICATION_QUEUE: certificate_notifications
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MONGODB_URI: mongodb://${MONGO_USER-admin}:${MONGO_PASSWORD}@mongodb:27017/certification?authSource=admin
      MONGODB_DB_NAME: certification
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_USER-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD}
      MINIO_CERT_BUCKET: certificates
      MINIO_REPORT_BUCKET: reports
      IMAGE_ACCESS_KEY: ${IMAGE_ACCESS_KEY}
      IMAGE_SERVICE_URL: "http://nextjs:3000/api/images"
      API_KEY: ${IMAGE_ACCESS_KEY}
    restart: unless-stopped
    networks:
      - internal_network
networks:
  internal_network:
    driver: bridge  
volumes:
  mongodb_data:
  minio_data:
  rabbitmq_data:
  redis_data:
